<section class="projets">
  <div class="projets-head">
    <h1 class="reveal r2">Ce que j'ai construit</h1>
    <p class="lead reveal r3">
      Applications web, mobiles et académiques — du prototype à la mise en production,
      avec le code source pour la plupart sur GitHub.
    </p>
  </div>

  <div class="projets-grid">
    <article
      class="card reveal r4"
      *ngFor="let p of projects"
      [style.--img]="'url(' + p.image + ')'">

      <span class="badge" [ngClass]="p.badgeType">{{ p.badge }}</span>

      <div class="card-content">
        <h3>{{ p.title }}</h3>
        <p class="desc">{{ p.desc }}</p>

        <div class="stack">
          <span class="chip" *ngFor="let t of p.tags">{{ t }}</span>
        </div>

        <ul class="features" *ngIf="p.features?.length">
          <li *ngFor="let f of p.features">{{ f }}</li>
        </ul>

        <div class="card-links" *ngIf="p.links?.length">
          <a *ngFor="let l of p.links" [href]="l.url" target="_blank" rel="noopener">{{ l.label }} ↗</a>
        </div>
      </div>
    </article>
  </div>

  <a href="https://github.com/jpdmtbianquinch30" target="_blank" rel="noopener" class="see-all reveal r5">
    Voir tous mes repos sur GitHub ↗
  </a>
</section>
